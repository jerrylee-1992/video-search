<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>失败镜头 · Video Footage Search</title>
  <style>
    :root{color-scheme:light;--ink:#292522;--muted:#766e68;--paper:#f6f1ea;--card:#fffdf9;--line:#e3d8ce;--danger:#9a403f;--danger-bg:#f8e9e6}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:linear-gradient(145deg,#faf6f0,#eee4db);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
    main{width:min(1180px,calc(100% - 36px));margin:auto;padding:54px 0 100px}header{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:30px}
    .eyebrow{color:var(--danger);font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}h1{margin:8px 0 5px;font:500 clamp(34px,5vw,58px)/1 Georgia,"Songti SC",serif}.sub{color:var(--muted);line-height:1.7}
    a{color:#714846;text-underline-offset:3px}.meta{margin:18px 0;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
    article{overflow:hidden;border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:0 10px 28px rgba(67,49,38,.07);cursor:pointer;transition:.2s}article:hover{transform:translateY(-3px)}
    .thumb{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,#d8bbb4,#625a58);overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.range{position:absolute;right:10px;bottom:9px;padding:5px 7px;border-radius:7px;color:#fff;background:#241f1dcc;font-size:11px}
    .body{padding:16px}.shot{font-weight:700}.error{margin:10px 0 0;color:var(--danger);font-size:13px;line-height:1.5}.path{margin-top:12px;color:#958b84;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.empty{grid-column:1/-1;padding:72px 20px;border:1px dashed #cbbeb3;border-radius:16px;text-align:center;color:var(--muted)}
    dialog{width:min(1020px,calc(100% - 28px));max-height:92vh;padding:0;border:0;border-radius:18px;overflow:auto;background:#171514;box-shadow:0 30px 90px #0006}dialog::backdrop{background:#271f1db5;backdrop-filter:blur(5px)}video{display:block;width:100%;max-height:57vh;background:#000}.bar{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:13px 16px;color:#eee}.bar button{padding:9px 14px;border:0;border-radius:9px;color:#fff;background:#403a37;cursor:pointer}.detail{padding:22px;background:var(--paper)}.detail h2{margin:0 0 15px;font-size:18px}.detail h3{margin:20px 0 8px;color:#714846;font-size:14px}.detail pre{margin:0;padding:14px;overflow:auto;border:1px solid var(--line);border-radius:11px;background:#fffdf9;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace}.fact{color:var(--muted);line-height:1.7}.attempt{margin-top:12px}.attempt b{font-size:13px}.loading{padding:60px;text-align:center;color:var(--muted)}
    @media(max-width:650px){main{padding-top:34px}header{align-items:start;flex-direction:column}.grid{grid-template-columns:1fr}.detail{padding:16px}}
  </style>
</head>
<body>
<main>
  <header><div><div class="eyebrow">Analysis diagnostics</div><h1>失败镜头</h1><div class="sub">模型输出无效时，镜头会留在这里，后续镜头仍继续解析。</div></div><a href="/">返回镜头搜索</a></header>
  <div class="meta" id="meta">正在读取…</div><section class="grid" id="grid"></section>
</main>
<dialog id="dialog"><video id="video" controls playsinline></video><div class="bar"><span id="title"></span><button id="close" type="button">关闭</button></div><section class="detail" id="detail"></section></dialog>
<script>
const grid=document.querySelector('#grid'),meta=document.querySelector('#meta'),dialog=document.querySelector('#dialog'),video=document.querySelector('#video'),title=document.querySelector('#title'),detail=document.querySelector('#detail');
const time=value=>{const minutes=Math.floor(value/60),seconds=(value%60).toFixed(1).padStart(4,'0');return `${minutes}:${seconds}`};
const tokenQuery=item=>item.identity_token?`?token=${encodeURIComponent(item.identity_token)}`:'';
function failureRecord(item){return item.analysis&&item.analysis.failure?item.analysis.failure:item.analysis||{}}
function show(item){const failure=failureRecord(item);video.src=`/media/${item.id}${tokenQuery(item)}`;video.dataset.start=item.start_seconds;video.dataset.end=item.end_seconds;title.textContent=`镜头 ${item.shot_index+1} · ${time(item.start_seconds)}–${time(item.end_seconds)}`;detail.replaceChildren();const heading=document.createElement('h2');heading.textContent=item.error||failure.error||'模型分析失败';const source=document.createElement('div');source.className='fact';source.textContent=`${item.video_path} · ${time(item.start_seconds)}–${time(item.end_seconds)}`;detail.append(heading,source);const attempts=Array.isArray(failure.attempts)?failure.attempts:[];attempts.forEach((attempt,index)=>{const block=document.createElement('div');block.className='attempt';const label=document.createElement('b');label.textContent=`第 ${index+1} 次输出${attempt.mode?` · ${attempt.mode}`:''}`;const reason=document.createElement('div');reason.className='fact';reason.textContent=attempt.error||'';const raw=document.createElement('pre');raw.textContent=attempt.raw_response||'(没有原始文本)';block.append(label,reason,raw);detail.appendChild(block)});if(item.analysis&&item.analysis.thumbnail_error){const label=document.createElement('h3');label.textContent='缩略图错误';const raw=document.createElement('pre');raw.textContent=item.analysis.thumbnail_error;detail.append(label,raw)}if(!attempts.length){const label=document.createElement('h3');label.textContent='失败记录';const raw=document.createElement('pre');raw.textContent=JSON.stringify(item.analysis,null,2);detail.append(label,raw)}if(!dialog.open)dialog.showModal();dialog.scrollTop=0;video.addEventListener('loadedmetadata',()=>{video.currentTime=Number(video.dataset.start);video.play().catch(()=>{})},{once:true})}
function render(data){meta.textContent=`共 ${data.count} 个失败镜头`;grid.replaceChildren();if(!data.count){const empty=document.createElement('div');empty.className='empty';empty.textContent='目前没有失败镜头。';grid.appendChild(empty);return}data.failures.forEach(item=>{const card=document.createElement('article');const thumb=document.createElement('div');thumb.className='thumb';if(item.thumbnail_available){const image=document.createElement('img');image.src=`/thumbnail/${item.id}${tokenQuery(item)}`;image.alt='';thumb.appendChild(image)}const range=document.createElement('span');range.className='range';range.textContent=`${time(item.start_seconds)}–${time(item.end_seconds)}`;thumb.appendChild(range);const body=document.createElement('div');body.className='body';const shot=document.createElement('div');shot.className='shot';shot.textContent=`镜头 ${item.shot_index+1}`;const error=document.createElement('p');error.className='error';error.textContent=item.error||'模型分析失败';const path=document.createElement('div');path.className='path';path.textContent=item.video_path;body.append(shot,error,path);card.append(thumb,body);card.addEventListener('click',()=>show(item));grid.appendChild(card)})}
video.addEventListener('timeupdate',()=>{if(video.currentTime>=Number(video.dataset.end))video.pause()});document.querySelector('#close').addEventListener('click',()=>{video.pause();dialog.close()});
fetch('/api/failures').then(response=>{if(!response.ok)throw new Error('request failed');return response.json()}).then(render).catch(()=>{meta.textContent='读取失败';grid.innerHTML='<div class="empty">无法读取失败镜头，请检查本地服务。</div>'});
</script>
</body>
</html>
